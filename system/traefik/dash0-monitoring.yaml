---
apiVersion: operator.dash0.com/v1beta1
kind: Dash0Monitoring
metadata:
  name: dash0-traefik-monitoring
  namespace: traefik
spec:
  instrumentWorkloads:
    mode: none        # traefik isn't SDK-instrumented; it already ships traces natively via tracing.otlp
  logCollection:
    enabled: false    # logs are handled by vector, not Dash0, elsewhere in this repo
  eventCollection:
    enabled: true
  prometheusScraping:
    enabled: true      # scrape the ServiceMonitor traefik's chart already creates
  synchronizePersesDashboards: true
