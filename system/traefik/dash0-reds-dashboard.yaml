---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: traefik-reds-dashboard
  namespace: traefik
spec:
  config:
    display:
      name: Traefik REDS Dashboard
    duration: 1h
    variables:
      - kind: ListVariable
        spec:
          name: service
          allowMultiple: false
          allowAllValue: false
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              labelName: service
              matchers:
                - traefik_service_requests_total
      - kind: ListVariable
        spec:
          name: namespace
          allowMultiple: false
          allowAllValue: false
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              labelName: k8s.namespace.name
              matchers:
                - '{"container.memory.usage"}'
      - kind: ListVariable
        spec:
          name: workload
          allowMultiple: false
          allowAllValue: false
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              labelName: k8s.deployment.name
              matchers:
                - '{"container.memory.usage", "k8s.namespace.name"=~"$namespace"}'
    panels:
      rate:
        kind: Panel
        spec:
          display:
            name: Rate
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (service) (rate(traefik_service_requests_total{service=~"$service"}[5m]))
      errors:
        kind: Panel
        spec:
          display:
            name: Errors (5xx)
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (service) (rate(traefik_service_requests_total{service=~"$service", code=~"5.."}[5m]))
      duration:
        kind: Panel
        spec:
          display:
            name: Duration (p95)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: seconds
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{service=~"$service"}[5m])))
      memoryUsage:
        kind: Panel
        spec:
          display:
            name: Memory usage
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: bytes
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    # best-guess metric name (container.memory.usage was the only one confirmed live); verify in dash0 before trusting this panel
                    query: avg({"container.memory.usage", "k8s.namespace.name"=~"$namespace", "k8s.deployment.name"=~"$workload"})
      cpuUtilization:
        kind: Panel
        spec:
          display:
            name: CPU utilization
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: percent-decimal
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    # best-guess metric name, not confirmed live; verify in dash0 before trusting this panel
                    query: avg({"container.cpu.utilization", "k8s.namespace.name"=~"$namespace", "k8s.deployment.name"=~"$workload"})
      restarts:
        kind: Panel
        spec:
          display:
            name: Container restarts
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    # best-guess metric name, not confirmed live; verify in dash0 before trusting this panel
                    query: sum({"k8s.container.restarts", "k8s.namespace.name"=~"$namespace", "k8s.deployment.name"=~"$workload"})
    layouts:
      - kind: Grid
        spec:
          display:
            title: Rate / Errors / Duration
            collapse:
              open: true
          items:
            - x: 0
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/rate"
            - x: 8
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/errors"
            - x: 16
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/duration"
      - kind: Grid
        spec:
          display:
            title: Saturation
            collapse:
              open: true
          items:
            - x: 0
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/memoryUsage"
            - x: 8
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/cpuUtilization"
            - x: 16
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/restarts"
