---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: traefik-reds-dashboard
  namespace: traefik
spec:
  config:
    display:
      name: Traefik REDS Dashboard
    duration: 1h
    variables:
      - kind: ListVariable
        spec:
          name: service
          allowMultiple: false
          allowAllValue: false
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              labelName: exported_service
              matchers:
                - traefik_service_requests_total
      - kind: ListVariable
        spec:
          name: namespace
          allowMultiple: false
          allowAllValue: false
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              labelName: k8s_namespace_name
              matchers:
                - '{otel_metric_name="container.memory.usage"}'
      - kind: ListVariable
        spec:
          name: workload
          allowMultiple: false
          allowAllValue: false
          plugin:
            kind: PrometheusLabelValuesVariable
            spec:
              labelName: k8s_deployment_name
              matchers:
                - '{otel_metric_name="container.memory.usage", k8s_namespace_name=~"$namespace"}'
    panels:
      rate:
        kind: Panel
        spec:
          display:
            name: Request rate
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: requests/sec
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum by (code) (rate(traefik_service_requests_total{exported_service=~"$service"}[$__rate_interval]))
      errors:
        kind: Panel
        spec:
          display:
            name: Error rate (5xx)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: requests/sec
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum(rate(traefik_service_requests_total{exported_service=~"$service", code=~"5.."}[$__rate_interval]))
      duration:
        kind: Panel
        spec:
          display:
            name: Duration (p50 / p95 / p99)
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: seconds
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: histogram_quantile(0.50, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=~"$service"}[$__rate_interval])))
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: histogram_quantile(0.95, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=~"$service"}[$__rate_interval])))
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: histogram_quantile(0.99, sum by (le) (rate(traefik_service_request_duration_seconds_bucket{exported_service=~"$service"}[$__rate_interval])))
      memoryUsage:
        kind: Panel
        spec:
          display:
            name: Memory usage
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: bytes
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: avg({otel_metric_name="container.memory.usage", k8s_namespace_name=~"$namespace", k8s_deployment_name=~"$workload"})
      cpuUsage:
        kind: Panel
        spec:
          display:
            name: CPU usage
          plugin:
            kind: TimeSeriesChart
            spec:
              yAxis:
                format:
                  unit: decimal
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: avg({otel_metric_name="container.cpu.usage", k8s_namespace_name=~"$namespace", k8s_deployment_name=~"$workload"})
      restarts:
        kind: Panel
        spec:
          display:
            name: Container restarts
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: sum({otel_metric_name="k8s.container.restarts", k8s_namespace_name=~"$namespace", k8s_deployment_name=~"$workload"})
    layouts:
      - kind: Grid
        spec:
          display:
            title: Rate / Errors / Duration
            collapse:
              open: true
          items:
            - x: 0
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/rate"
            - x: 8
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/errors"
            - x: 16
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/duration"
      - kind: Grid
        spec:
          display:
            title: Saturation
            collapse:
              open: true
          items:
            - x: 0
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/memoryUsage"
            - x: 8
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/cpuUsage"
            - x: 16
              "y": 0
              width: 8
              height: 6
              content:
                "$ref": "#/spec/config/panels/restarts"
