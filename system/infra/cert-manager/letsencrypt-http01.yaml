---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: it-admin@elifesciences.org
    privateKeySecretRef:
      name: letsencrypt-http01
    solvers:
    # For hostnames in zones we do not hold in Route53, so the dns01 solver on
    # the `letsencrypt` issuer cannot write the _acme-challenge record.
    - http01:
        ingress:
          ingressClassName: traefik
