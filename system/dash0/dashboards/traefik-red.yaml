---
# RED (Rate, Errors, Duration) for any HTTP service routed by Traefik.
#
# The "service" variable is a Dash0 filter on exported_service, which is
# "{namespace}-{service}-{port}@kubernetes"; it expands to a complete label matcher,
# and matches every service when nothing is selected. label_replace strips the
# "@kubernetes" provider suffix to give a shorter "service" label for the legend.
#
# Per-service ratio panels only show services averaging at least "min_rate" req/s in the
# last hour (default 0.1). Below that a single request moves the ratio by several percent,
# which is just noise.
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: traefik-red
spec:
  config:
    display:
      name: Traefik - RED
      description: >-
        Request rate, errors and duration of any HTTP service, measured at the Traefik ingress.
    duration: 6h
    variables:
      - kind: Dash0FilterVariable
        spec:
          name: service
          display:
            name: Service
            description: Traefik service ({namespace}-{service}-{port}@kubernetes). Empty means all.
            hidden: false
          attributeKey: exported_service
          operator: is_any
          values: []
      - kind: ListVariable
        spec:
          name: min_rate
          display:
            name: Min. request rate
            description: >-
              Per-service ratio panels hide services averaging fewer requests per second than
              this over the last hour, as their ratios are dominated by single requests.
            hidden: false
          allowAllValue: false
          allowMultiple: false
          defaultValues:
            - "0.1"
          sort: none
          plugin:
            kind: StaticListVariable
            spec:
              values:
                - id: "0"
                  label: No cutoff
                  value: "0"
                - id: "0.01"
                  label: 0.01 req/s
                  value: "0.01"
                - id: "0.1"
                  label: 0.1 req/s
                  value: "0.1"
                - id: "1"
                  label: 1 req/s
                  value: "1"
    panels:
      # --- Overview (whole environment, over the selected time range) ---
      overview-rate:
        kind: Panel
        spec:
          display:
            name: Request rate
            description: Mean requests per second across the selected services in the selected time range.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: /s
                decimalPlaces: 2
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      sum(rate(traefik_service_requests_total{exported_service!="", $service}[$__range]))
                    seriesNameFormat: Requests
      overview-errors:
        kind: Panel
        spec:
          display:
            name: 5xx error ratio
            description: Share of responses with a 5xx status in the selected time range.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: percent-decimal
                decimalPlaces: 2
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      sum(rate(traefik_service_requests_total{exported_service!="", code=~"5..", $service}[$__range]))
                      /
                      sum(rate(traefik_service_requests_total{exported_service!="", $service}[$__range]))
                    seriesNameFormat: 5xx
      overview-slow:
        kind: Panel
        spec:
          display:
            name: Slower than 1.2s
            description: >-
              Share of requests that took longer than 1.2s in the selected time range. Read straight
              from a histogram bucket boundary, so it is exact rather than interpolated.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: percent-decimal
                decimalPlaces: 2
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      1 -
                      sum(rate(traefik_service_request_duration_seconds_bucket{exported_service!="", le="1.2", $service}[$__range]))
                      /
                      sum(rate(traefik_service_request_duration_seconds_bucket{exported_service!="", le="+Inf", $service}[$__range]))
                    seriesNameFormat: "> 1.2s"

      # --- Rate ---
      rate-by-service:
        kind: Panel
        spec:
          display:
            name: Requests by service
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                showLegend: true
              visual:
                display: line
                lineWidth: 1
                areaOpacity: 0
                connectNulls: true
                palette:
                  mode: categorical
                stack: none
              yAxis:
                show: true
                min: 0
                format:
                  unit: /s
                  decimalPlaces: 2
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      label_replace(
                        sum by (exported_service) (rate(traefik_service_requests_total{exported_service!="", $service}[5m])),
                        "service", "$1", "exported_service", "^(.+)@kubernetes(crd)?$"
                      )
                    seriesNameFormat: "{{service}}"
      rate-by-status-class:
        kind: Panel
        spec:
          display:
            name: Responses by status class
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                showLegend: true
              visual:
                display: bar
                palette:
                  mode: categorical
                stack: all
              yAxis:
                show: true
                min: 0
                format:
                  unit: /s
                  decimalPlaces: 2
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      sum by (class) (
                        label_replace(
                          rate(traefik_service_requests_total{exported_service!="", $service}[5m]),
                          "class", "$1", "code", "^(.).."
                        )
                      )
                    seriesNameFormat: "{{class}}xx"

      # --- Errors ---
      errors-ratio-by-service:
        kind: Panel
        spec:
          display:
            name: 5xx error ratio by service
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                showLegend: true
              visual:
                display: line
                lineWidth: 1
                areaOpacity: 0
                connectNulls: true
                palette:
                  mode: categorical
                stack: none
              yAxis:
                show: true
                min: 0
                format:
                  unit: percent-decimal
                  decimalPlaces: 1
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      label_replace(
                        sum by (exported_service) (rate(traefik_service_requests_total{exported_service!="", code=~"5..", $service}[5m]))
                        /
                        sum by (exported_service) (rate(traefik_service_requests_total{exported_service!="", $service}[5m]))
                        and on (exported_service)
                        sum by (exported_service) (rate(traefik_service_requests_total{exported_service!="", $service}[1h])) >= $min_rate,
                        "service", "$1", "exported_service", "^(.+)@kubernetes(crd)?$"
                      )
                    seriesNameFormat: "{{service}}"
      errors-by-code:
        kind: Panel
        spec:
          display:
            name: Error responses by status code
            description: 4xx and 5xx responses. 499 means the client gave up before the service answered.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                showLegend: true
              visual:
                display: bar
                palette:
                  mode: categorical
                stack: all
              yAxis:
                show: true
                min: 0
                format:
                  unit: /s
                  decimalPlaces: 2
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      sum by (code) (rate(traefik_service_requests_total{exported_service!="", code=~"[45]..", $service}[5m])) > 0
                    seriesNameFormat: "{{code}}"

      # --- Duration ---
      # Traefik's buckets are coarse (0.1s, 0.3s, 1.2s, 5s), so interpolated percentiles mislead.
      # Instead show the share of requests above a bucket boundary, which is exact.
      duration-slow-300ms-by-service:
        kind: Panel
        spec:
          display:
            name: Share of requests slower than 300ms by service
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                showLegend: true
              visual:
                display: line
                lineWidth: 1
                areaOpacity: 0
                connectNulls: true
                palette:
                  mode: categorical
                stack: none
              yAxis:
                show: true
                min: 0
                format:
                  unit: percent-decimal
                  decimalPlaces: 1
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      label_replace(
                        1 -
                        sum by (exported_service) (rate(traefik_service_request_duration_seconds_bucket{exported_service!="", le="0.3", $service}[5m]))
                        /
                        sum by (exported_service) (rate(traefik_service_request_duration_seconds_bucket{exported_service!="", le="+Inf", $service}[5m]))
                        and on (exported_service)
                        sum by (exported_service) (rate(traefik_service_requests_total{exported_service!="", $service}[1h])) >= $min_rate,
                        "service", "$1", "exported_service", "^(.+)@kubernetes(crd)?$"
                      )
                    seriesNameFormat: "{{service}}"
      duration-slow-1200ms-by-service:
        kind: Panel
        spec:
          display:
            name: Share of requests slower than 1.2s by service
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
                showLegend: true
              visual:
                display: line
                lineWidth: 1
                areaOpacity: 0
                connectNulls: true
                palette:
                  mode: categorical
                stack: none
              yAxis:
                show: true
                min: 0
                format:
                  unit: percent-decimal
                  decimalPlaces: 1
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: >-
                      label_replace(
                        1 -
                        sum by (exported_service) (rate(traefik_service_request_duration_seconds_bucket{exported_service!="", le="1.2", $service}[5m]))
                        /
                        sum by (exported_service) (rate(traefik_service_request_duration_seconds_bucket{exported_service!="", le="+Inf", $service}[5m]))
                        and on (exported_service)
                        sum by (exported_service) (rate(traefik_service_requests_total{exported_service!="", $service}[1h])) >= $min_rate,
                        "service", "$1", "exported_service", "^(.+)@kubernetes(crd)?$"
                      )
                    seriesNameFormat: "{{service}}"
    layouts:
      - kind: Grid
        spec:
          display:
            title: Overview
            collapse:
              open: true
          items:
            - {x: 0, y: 0, width: 8, height: 4, content: {$ref: "#/spec/panels/overview-rate"}}
            - {x: 8, y: 0, width: 8, height: 4, content: {$ref: "#/spec/panels/overview-errors"}}
            - {x: 16, y: 0, width: 8, height: 4, content: {$ref: "#/spec/panels/overview-slow"}}
      - kind: Grid
        spec:
          display:
            title: Rate
            collapse:
              open: true
          items:
            - {x: 0, y: 0, width: 12, height: 8, content: {$ref: "#/spec/panels/rate-by-service"}}
            - {x: 12, y: 0, width: 12, height: 8, content: {$ref: "#/spec/panels/rate-by-status-class"}}
      - kind: Grid
        spec:
          display:
            title: Errors
            collapse:
              open: true
          items:
            - {x: 0, y: 0, width: 12, height: 8, content: {$ref: "#/spec/panels/errors-ratio-by-service"}}
            - {x: 12, y: 0, width: 12, height: 8, content: {$ref: "#/spec/panels/errors-by-code"}}
      - kind: Grid
        spec:
          display:
            title: Duration
            collapse:
              open: true
          items:
            - {x: 0, y: 0, width: 12, height: 8, content: {$ref: "#/spec/panels/duration-slow-300ms-by-service"}}
            - {x: 12, y: 0, width: 12, height: 8, content: {$ref: "#/spec/panels/duration-slow-1200ms-by-service"}}
