---
# Health of the alerting pipeline itself: collectors -> Dash0 ingestion -> check evaluation.
# If any of these fire, other checks may be silently blind.
#
# Collector topology (dash0-operator):
#   - agent daemonset: kubelet_stats, prometheus, host_metrics, file_log receivers (one pod per node)
#   - cluster-metrics deployment: k8s_cluster, k8s_events receivers (singleton)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alerting-health
  namespace: dash0-checks
spec:
  groups:
    - name: alerting-health
      rules:
        # --- Check evaluation ---
        - alert: ChecksNotEvaluating
          # Split by type: synthetic checks emit the same metric and would otherwise
          # mask check rules no longer being evaluated.
          expr: >-
            label_replace(absent(dash0_check_evaluation_outcome{dash0_check_type="check_rule"}), "check_type", "check_rule", "", "")
            or
            label_replace(absent(dash0_check_evaluation_outcome{dash0_check_type="synthetic.http"}), "check_type", "synthetic.http", "", "")
          for: 15m
          annotations:
            summary: No Dash0 evaluation outcomes recorded for {{ $labels.check_type }} checks
            description: >-
              Dash0 emits dash0.check.evaluation.outcome for evaluated checks.
              Absence means checks are not synchronised (PrometheusRules / synthetic checks) or not evaluated.
              Note this cannot detect Dash0 evaluation being down entirely, since this check would not run either.

        # --- Collectors shipping ---
        - alert: NodeCollectorNotShipping
          expr: >-
            (k8s_node_condition_ready == 1)
            unless on (k8s_node_name)
            otelcol_process_uptime_seconds_total{k8s_daemonset_name="dash0-operator-opentelemetry-collector-agent-daemonset"}
          for: 15m
          annotations:
            summary: Ready node {{ $labels.k8s_node_name }} has no agent collector shipping telemetry
            description: >-
              The node is Ready but no dash0 agent daemonset collector on it is reporting.
              Container metrics, scraped metrics and logs from this node are missing.

        - alert: CollectorReceiverStalled
          expr: >-
            sum by (receiver) (rate(otelcol_receiver_accepted_metric_points_total{receiver="kubelet_stats"}[10m])) == 0
            or
            sum by (receiver) (rate(otelcol_receiver_accepted_log_records_total{receiver=~"^(k8s_events|file_log)$"}[10m])) == 0
          for: 15m
          annotations:
            summary: Collector receiver {{ $labels.receiver }} is running but accepting no data

        # --- Scrape targets other checks depend on ---
        # Checks on scraped metrics return nothing when the target stops being scraped,
        # so they go quiet instead of firing. One series per source, labelled by source.
        - alert: MetricSourceMissing
          expr: >-
            label_replace(absent(k8s_node_condition_ready), "source", "k8s-cluster", "", "")
            or
            label_replace(absent(certmanager_certificate_expiration_timestamp_seconds), "source", "cert-manager", "", "")
            or
            label_replace(absent(external_dns_controller_last_sync_timestamp_seconds), "source", "external-dns", "", "")
            or
            label_replace(absent(externalsecret_status_condition), "source", "external-secrets", "", "")
            or
            label_replace(absent(traefik_entrypoint_requests_total), "source", "traefik", "", "")
            or
            label_replace(absent(gotk_resource_info), "source", "kube-state-metrics", "", "")
          for: 15m
          annotations:
            summary: No metrics received from {{ $labels.source }}
            description: >-
              Checks built on {{ $labels.source }} metrics (node/pod/workload state, platform-integrations,
              IngressHighErrorRate, flux-health) are blind. For k8s-cluster, check the k8s_cluster receiver in
              dash0-operator-cluster-metrics-collector-deployment. Otherwise check that its pods are running and
              its metrics endpoint is still being scraped (ServiceMonitor/PodMonitor or prometheus.io annotations).

        # --- Collectors exporting to Dash0 ---
        - alert: CollectorExportFailing
          expr: >-
            sum by (k8s_pod_name, exporter, dash0_resource_id, dash0_resource_name, dash0_resource_type) (
              rate(otelcol_exporter_send_failed_metric_points_total[10m])
              or rate(otelcol_exporter_send_failed_log_records_total[10m])
              or rate(otelcol_exporter_enqueue_failed_metric_points_total[10m])
              or rate(otelcol_exporter_enqueue_failed_log_records_total[10m])
            ) > 0
          for: 15m
          annotations:
            summary: Collector {{ $labels.k8s_pod_name }} is failing to export telemetry to Dash0
            description: >-
              send_failed means Dash0 ingestion rejected or did not accept data after retries;
              enqueue_failed means the sending queue was full and data was dropped
              (covers the queue filling up, so there is no separate queue-capacity check).

        - alert: CollectorRefusingData
          expr: >-
            sum by (k8s_pod_name, receiver, dash0_resource_id, dash0_resource_name, dash0_resource_type) (
              rate(otelcol_receiver_refused_metric_points_total[10m])
              or rate(otelcol_receiver_refused_log_records_total[10m])
            ) > 0
          for: 15m
          annotations:
            summary: Collector {{ $labels.k8s_pod_name }} receiver {{ $labels.receiver }} is refusing data
            description: Usually the memory limiter applying backpressure; the collector likely needs more memory.
