---
# Uptime checks migrated from Pingdom, run from Dash0's public locations.
# Locations, retries, notifications and request defaults shared by all checks are
# set once in synthetic-checks-defaults.yaml.
#
# --- elifesciences.org (via CDN) ---
apiVersion: operator.dash0.com/v1alpha1
kind: Dash0SyntheticCheck
metadata:
  name: elife-home-page
  namespace: dash0-checks
spec:
  display:
    name: eLife Home Page
  enabled: true
  schedule:
    interval: 15m
  plugin:
    kind: http
    spec:
      request:
        method: get
        url: https://elifesciences.org/
      assertions:
        criticalAssertions:
          - kind: status_code
            spec:
              operator: is
              value: "200"
        degradedAssertions: []
---
apiVersion: operator.dash0.com/v1alpha1
kind: Dash0SyntheticCheck
metadata:
  name: elife-submit-your-research
  namespace: dash0-checks
spec:
