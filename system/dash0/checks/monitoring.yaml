---
# Only PrometheusRules in this namespace are synchronised to Dash0 as checks.
# Everything else is disabled: nothing runs here, and the monitoringTemplate in
# ../release.yaml keeps synchronizePrometheusRules off for all other namespaces.
apiVersion: operator.dash0.com/v1beta1
kind: Dash0Monitoring
metadata:
  name: dash0-monitoring-resource
  namespace: dash0-checks
spec:
  instrumentWorkloads:
    mode: none
  logCollection:
    enabled: false
  eventCollection:
    enabled: false
  prometheusScraping:
    enabled: false
  synchronizePersesDashboards: false
  synchronizePrometheusRules: true
