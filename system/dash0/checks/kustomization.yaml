apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dash0-checks
resources:
- namespace.yaml
- monitoring.yaml
- alerting-health.yaml
- cluster-survival.yaml
- resource-saturation.yaml
- workload-health.yaml
- flux-health.yaml
- platform-integrations.yaml
- notification-channel.yaml
- spam-filter-collector-self-monitoring.yaml
- synthetic-checks.yaml
patches:
- path: synthetic-checks-defaults.yaml
  target:
    kind: Dash0SyntheticCheck
