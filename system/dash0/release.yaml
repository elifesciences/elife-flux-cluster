---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dash0-operator
  namespace: dash0
spec:
  interval: 5m
  chart:
    spec:
      chart: dash0-operator
      version: 0.157.0
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: dash0-operator
  values:
    operator:
      clusterName: ${cluster_name}
      prometheusCrdSupportEnabled: true
      collectors:
        daemonSetCollectorContainerResources:
          requests:
            memory: 128Mi
          limits:
            memory: 500Mi
        daemonSetTolerations:
          - operator: Exists
      dash0Export:
        enabled: true
        endpoint: ingress.us-east-1.aws.dash0.com:4317
        apiEndpoint: https://api.us-east-1.aws.dash0.com
        secretRef:
          name: dash0-credentials
          key: token
      autoMonitorNamespaces:
        enabled: true
      selfMonitoring:
        enabled: true
      monitoringTemplate:
        spec:
          instrumentWorkloads:
            mode: none
          logCollection:
            enabled: true
          eventCollection:
            enabled: true
          prometheusScraping:
            enabled: true
          synchronizePersesDashboards: false
          synchronizePrometheusRules: false
          filter:
            # Metric names in OTTL use OTel dot-notation (k8s.container.restarts).
            # PromQL and the Dash0 UI expose them with underscores (k8s_container_restarts).
            metrics:
              metric:
                # Whole namespaces are excluded via the dash0.com/enable=false label on
                # the namespace itself (see system/{vector,victorialogs,victoriametrics}),
                # which also stops the collector scraping those pods in the first place.
                #
                # --- Entire families not used in any alert ---
                - 'IsMatch(name, "^otelcol_")'       # collector self-monitoring
                - 'IsMatch(name, "^mongodb_")'       # mongo metrics
            logs:
              log_records:
                # Logs are opt-in per workload via the dash0.com/log-level pod label,
                # whose value is the minimum severity to ship (trace|debug|info|warn|error).
                # Records without a parsed severity (UNSPECIFIED) are always kept.
                # k8s events (eventCollection) use a separate pipeline and are not affected.
                - 'resource.attributes["k8s.pod.label.dash0.com/log-level"] == nil'
                - 'resource.attributes["k8s.pod.label.dash0.com/log-level"] == "debug" and severity_number > SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_DEBUG'
                - 'resource.attributes["k8s.pod.label.dash0.com/log-level"] == "info" and severity_number > SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_INFO'
                - 'resource.attributes["k8s.pod.label.dash0.com/log-level"] == "warn" and severity_number > SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_WARN'
                - 'resource.attributes["k8s.pod.label.dash0.com/log-level"] == "error" and severity_number > SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_ERROR'

