---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dash0-operator
  namespace: dash0
spec:
  interval: 5m
  chart:
    spec:
      chart: dash0-operator
      version: 0.150.0
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: dash0-operator
  values:
    enabled: true
    operator:
      clusterName: ${cluster_name}
      collectors:
        daemonSetCollectorContainerResources:
          requests:
            memory: 128Mi
          limits:
            memory: 500Mi
      dash0Export:
        enabled: true
        endpoint: ingress.eu-west-1.aws.dash0.com:4317
        apiEndpoint: https://api.eu-west-1.aws.dash0.com
        secretRef:
          name: dash0-credentials
          key: token
          autoMonitorNamespaces:
      monitoringTemplate:
        spec:
          instrumentWorkloads:
            mode: none
          logCollection:
            enabled: false
          eventCollection:
            enabled: true
          prometheusScraping:
            enabled: false
          synchronizePersesDashboards: false
          synchronizePrometheusRules: false
