---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dash0-operator
  namespace: dash0
spec:
  interval: 5m
  chart:
    spec:
      chart: dash0-operator
      version: 0.161.0
      interval: 5m
      sourceRef:
        kind: HelmRepository
        name: dash0-operator
  values:
    operator:
      clusterName: ${cluster_name}
      prometheusCrdSupportEnabled: true
      managerContainerResources:
        requests:
          cpu: 50m
          memory: 256Mi
          ephemeral-storage: 500Mi
        limits:
          cpu: 500m
          memory: 384Mi
          ephemeral-storage: 500Mi
        gomemlimit: 307MiB
      targetAllocator:
        containerResources:
          requests:
            cpu: 25m
            memory: 160Mi
          limits:
            cpu: 200m
            memory: 500Mi
      collectors:
        k8s_attributes:
          # One k8s_attributes processor (and set of informers) shared by all pipelines instead
          # of one per pipeline. Enables an alpha collector feature gate.
          shareProcessorBetweenPipelines: true
          # Stops watching ReplicaSets. We lose k8s.deployment.uid, and k8s.deployment.name may be
          # wrong in some edge cases.
          disableReplicasetInformer: true
        daemonSetCollectorContainerResources:
          requests:
            cpu: 30m
            memory: 160Mi
          limits:
            memory: 500Mi
        deploymentCollectorContainerResources:
          requests:
            cpu: 50m
            memory: 320Mi
          limits:
            memory: 500Mi
        daemonSetTolerations:
          - operator: Exists
        # Without a priority the agent can't preempt, so on a node that filled up before the
        # agent was placed (e.g. a 2 vCPU core node with karpenter on it) it stays Pending.
        # system-node-critical lets the scheduler evict lower priority pods to make room.
        daemonSetPriorityClassName: system-node-critical
        filelogOffsetSyncStorageVolume:
          name: filelogreceiver-offsets
          hostPath:
            path: /data/dash0-operator/offset-storage
            type: DirectoryOrCreate
      dash0Export:
        enabled: true
        endpoint: ingress.us-east-1.aws.dash0.com:4317
        apiEndpoint: https://api.us-east-1.aws.dash0.com
        secretRef:
          name: dash0-credentials
          key: token
      transform:
        error_mode: ignore
        metric_statements:
          # Traefik labels its metrics by method, protocol, code and TLS details, multiplying
          # series per exported_service. Sum datapoints down to what the dashboards and checks
          # use. This runs per scraped Traefik pod, so the pod remains a dimension: dropping it
          # would interleave the cumulative counters of different pods in one series.
          # The scrape target labels (endpoint, namespace, pod, container, service) are kept;
          # they are constant per pod.
          - context: metric
            statements:
              - >-
                aggregate_on_attributes("sum", ["exported_service", "entrypoint", "code", "endpoint", "namespace", "pod", "container", "service"])
                where IsMatch(metric.name, "^traefik_(service|entrypoint)_requests(_total)?$")
              - >-
                aggregate_on_attributes("sum", ["exported_service", "entrypoint", "endpoint", "namespace", "pod", "container", "service"])
                where IsMatch(metric.name, "^traefik_(service|entrypoint)_")
                and not IsMatch(metric.name, "^traefik_(service|entrypoint)_requests(_total)?$")
      # Cluster-wide metric filters. Filters in monitoringTemplate only apply to auto-monitored
      # namespaces, which excludes the operator's own dash0 namespace (one collector per node).
      filter:
        error_mode: ignore
        # Metric names in OTTL use OTel dot-notation (k8s.container.restarts).
        # PromQL and the Dash0 UI expose them with underscores (k8s_container_restarts).
        metrics:
          metric:
            # Whole namespaces are excluded via the dash0.com/enable=false label on
            # the namespace itself (see system/{vector,victorialogs,victoriametrics}),
            # which also stops the collector scraping those pods in the first place.
            #
            # --- Entire families not used in any alert ---
            - 'IsMatch(name, "^mongodb_")'       # mongo metrics
            # Go runtime and controller internals of every scraped target (flux, cert-manager, ...)
            - 'IsMatch(name, "^(go|process|controller_runtime|workqueue|rest_client|opentelemetry_allocator)_")'
            # Flux controller internals; gotk_resource_info comes from system/dash0/kube-state-metrics
            - 'IsMatch(name, "^gotk_") and name != "gotk_resource_info"'
            # Collector self-monitoring (otelcol*) bypasses this pipeline, see the spam filter in checks/
            # Container usage details, checks only use container.cpu.usage and container.memory.working_set
            - 'IsMatch(name, "^container[.](memory[.](rss|usage|page_faults|major_page_faults|available)|filesystem[.].*|cpu[.]time)$")'
            # Pod-level duplicates of the container metrics. Checks only use k8s.pod.filesystem.usage;
            # k8s.pod.cpu.usage and k8s.pod.memory.working_set are kept for Dash0's pod resource views.
            - 'IsMatch(name, "^k8s[.]pod[.](cpu[.]time|memory[.](usage|rss|page_faults|major_page_faults|available)|filesystem[.](capacity|available))$")'
            - 'IsMatch(name, "^k8s[.]pod[.].*_utilization$")'
            - 'IsMatch(name, "^k8s[.]pod[.]network[.]")'
            - 'IsMatch(name, "^k8s[.](replicaset|job)[.]")'
            - 'name == "k8s.container.ready"'
            - 'name == "k8s.container.status.state"'
            - 'name == "k8s.volume.inodes.used"'
            # Operators: checks only use externalsecret_status_condition,
            # certmanager_certificate_ready_status and certmanager_certificate_expiration_timestamp_seconds
            - 'name == "externalsecret_sync_calls_total" or name == "externalsecret_reconcile_duration"'
            - 'IsMatch(name, "^certmanager_certificate_(not_before|not_after|renewal)_timestamp_seconds$")'
            # Traefik: dashboards and checks only use service requests/duration/response bytes
            # and entrypoint requests
            - 'IsMatch(name, "^traefik_(tls_certs_not_after|service_requests_(bytes|tls)_total|entrypoint_(request_duration_seconds|requests_(bytes|tls)_total|responses_bytes_total))$")'
            # Karpenter: only what dashboards/karpenter.yaml uses. Prometheus normalisation may strip
            # the _total and _seconds suffixes, so both spellings are allowed.
            - >-
              IsMatch(name, "^karpenter_")
              and not IsMatch(name, "^karpenter_(nodepools_cost(_total)?|nodes_allocatable|nodes_total_pod_requests|nodes_current_lifetime(_seconds)?|voluntary_disruption_decisions_by_nodepool(_total)?)$")
            # Client, SDK and leader election internals of controllers (karpenter, ...)
            - 'IsMatch(name, "^(client_go|aws_sdk_go|operator|leader_election|certwatcher|promhttp)_")'
          datapoint:
            # Checks only look at PVCs, the bulk are emptyDir, configMap and secret volumes
            - 'IsMatch(metric.name, "^k8s[.]volume[.]") and resource.attributes["k8s.volume.type"] != "persistentVolumeClaim"'
            # Karpenter reports every resource type per node, the dashboard only uses CPU and memory
            - >-
              IsMatch(metric.name, "^karpenter_nodes_(allocatable|total_pod_requests)$")
              and attributes["resource_type"] != "cpu" and attributes["resource_type"] != "memory"
            # One series per possible reason per container, almost all 0
            - 'metric.name == "k8s.container.status.reason" and value_int == 0 and value_double == 0'
            # Most containers never restart.
            - 'metric.name == "k8s.container.restarts" and value_int == 0 and value_double == 0'
      autoMonitorNamespaces:
        enabled: true
      selfMonitoring:
        enabled: true
      monitoringTemplate:
        spec:
          instrumentWorkloads:
            mode: none
          logCollection:
            enabled: true
          eventCollection:
            enabled: true
          prometheusScraping:
            enabled: true
          synchronizePersesDashboards: false
          synchronizePrometheusRules: false
          filter:
            logs:
              log_records:
                # Logs are opt-in per workload via the dash0.com/log-level pod label,
                # whose value is the minimum severity to ship (trace|debug|info|warn|error).
                # Records without a parsed severity (UNSPECIFIED) are always kept.
                #
                # k8s events (eventCollection) pass through this same filter.
                # To avoid applying the log level filter to k8s events (that are shipped as logs)
                # we check if k8s.event.name is nil.
                - 'attributes["k8s.event.name"] == nil and resource.attributes["k8s.pod.label.dash0.com/log-level"] == nil'
                - 'attributes["k8s.event.name"] == nil and resource.attributes["k8s.pod.label.dash0.com/log-level"] == "debug" and severity_number > SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_DEBUG'
                - 'attributes["k8s.event.name"] == nil and resource.attributes["k8s.pod.label.dash0.com/log-level"] == "info" and severity_number > SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_INFO'
                - 'attributes["k8s.event.name"] == nil and resource.attributes["k8s.pod.label.dash0.com/log-level"] == "warn" and severity_number > SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_WARN'
                - 'attributes["k8s.event.name"] == nil and resource.attributes["k8s.pod.label.dash0.com/log-level"] == "error" and severity_number > SEVERITY_NUMBER_UNSPECIFIED and severity_number < SEVERITY_NUMBER_ERROR'
                # Limit namespace k8s events to severity > WARN, all cluster scoped events are shipped regardless of level.
                # Karpenter's Evicted events are INFO but feed the Karpenter dashboard, so keep them.
                - >-
                  attributes["k8s.event.name"] != nil and severity_number < SEVERITY_NUMBER_WARN
                  and resource.attributes["k8s.namespace.name"] != nil and resource.attributes["k8s.namespace.name"] != ""
                  and not (attributes["k8s.event.reason"] == "Evicted" and attributes["k8s.event.reporting_controller"] == "karpenter")

