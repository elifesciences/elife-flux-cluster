apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mira-epp-elifepathways-experiment
  namespace: epp--prod
  annotations:
    # http01, not the default dns01 `letsencrypt` issuer: elifepathways.org is
    # hosted on DNSimple, so cert-manager cannot write the challenge record.
    cert-manager.io/cluster-issuer: "letsencrypt-http01"
spec:
  ingressClassName: traefik
  rules:
    - host: epp.elifepathways.org
      http:
        paths:
          - path: /mira
            pathType: Prefix
            backend:
              service:
                name: epp-client
                port:
                  number: 3000
          - path: /_next/static
            pathType: Prefix
            backend:
              service:
                name: epp-client
                port:
                  number: 3000
  tls:
    - hosts:
        - epp.elifepathways.org
      secretName: mira-epp-elifepathways-experiment-tls
